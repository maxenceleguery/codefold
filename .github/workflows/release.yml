name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------
  # Rust: publish codefold-core then codefold-cli to crates.io
  # ----------------------------------------------------------------------
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Exchange the GitHub OIDC token for a short-lived crates.io token.
      # Requires that the user has configured a Trusted Publisher for this
      # repo + workflow on crates.io (one-time, on the registry).
      - name: Resolve workspace version
        id: ver
        run: |
          V=$(cargo metadata --format-version=1 --no-deps \
              | jq -r '.packages[] | select(.name == "codefold-core") | .version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $V"

      # crates.io rejects requests without a User-Agent (403). Always send one.
      - name: Check if codefold-core@${{ steps.ver.outputs.version }} is already on crates.io
        id: core_published
        run: |
          if curl -sfo /dev/null \
              -H "Accept: application/json" \
              -H "User-Agent: codefold-release-workflow (github.com/maxenceleguery/codefold)" \
              "https://crates.io/api/v1/crates/codefold-core/${{ steps.ver.outputs.version }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "codefold-core@${{ steps.ver.outputs.version }} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if codefold-cli@${{ steps.ver.outputs.version }} is already on crates.io
        id: cli_published
        run: |
          if curl -sfo /dev/null \
              -H "Accept: application/json" \
              -H "User-Agent: codefold-release-workflow (github.com/maxenceleguery/codefold)" \
              "https://crates.io/api/v1/crates/codefold-cli/${{ steps.ver.outputs.version }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "codefold-cli@${{ steps.ver.outputs.version }} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io (Trusted Publishing)
        if: steps.core_published.outputs.skip == 'false' || steps.cli_published.outputs.skip == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish codefold-core
        if: steps.core_published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p codefold-core --no-verify

      # crates.io needs a moment to make the just-uploaded version visible
      # to the resolver before codefold-cli can depend on it.
      - name: Wait for crates.io to surface codefold-core
        if: steps.core_published.outputs.skip == 'false'
        run: sleep 45

      - name: Publish codefold-cli
        if: steps.cli_published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p codefold-cli --no-verify

  # ----------------------------------------------------------------------
  # Python: build wheels for Linux/macOS/Windows + sdist, then publish to PyPI
  # ----------------------------------------------------------------------
  build-wheels:
    name: Build wheel (${{ matrix.os }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64 }
          - { os: ubuntu-latest,  target: aarch64 }
          - { os: macos-latest,   target: x86_64 }
          - { os: macos-latest,   target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      id-token: write # Trusted Publishing OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
