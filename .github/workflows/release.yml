name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------------
  # Rust: publish codefold-core then codefold-cli to crates.io
  # ----------------------------------------------------------------------
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Exchange the GitHub OIDC token for a short-lived crates.io token.
      # Requires that the user has configured a Trusted Publisher for this
      # repo + workflow on crates.io (one-time, on the registry).
      - name: Resolve workspace version
        id: ver
        run: |
          V=$(cargo metadata --format-version=1 --no-deps \
              | jq -r '.packages[] | select(.name == "codefold-core") | .version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $V"

      # crates.io rejects requests without a User-Agent (403). Always send one.
      - name: Check if codefold-core@${{ steps.ver.outputs.version }} is already on crates.io
        id: core_published
        run: |
          if curl -sfo /dev/null \
              -H "Accept: application/json" \
              -H "User-Agent: codefold-release-workflow (github.com/maxenceleguery/codefold)" \
              "https://crates.io/api/v1/crates/codefold-core/${{ steps.ver.outputs.version }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "codefold-core@${{ steps.ver.outputs.version }} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if codefold-cli@${{ steps.ver.outputs.version }} is already on crates.io
        id: cli_published
        run: |
          if curl -sfo /dev/null \
              -H "Accept: application/json" \
              -H "User-Agent: codefold-release-workflow (github.com/maxenceleguery/codefold)" \
              "https://crates.io/api/v1/crates/codefold-cli/${{ steps.ver.outputs.version }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "codefold-cli@${{ steps.ver.outputs.version }} already published"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io (Trusted Publishing)
        if: steps.core_published.outputs.skip == 'false' || steps.cli_published.outputs.skip == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish codefold-core
        if: steps.core_published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p codefold-core --no-verify

      # crates.io needs a moment to make the just-uploaded version visible
      # to the resolver before codefold-cli can depend on it.
      - name: Wait for crates.io to surface codefold-core
        if: steps.core_published.outputs.skip == 'false'
        run: sleep 45

      - name: Publish codefold-cli
        if: steps.cli_published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p codefold-cli --no-verify

  # ----------------------------------------------------------------------
  # Python: build wheels for Linux/macOS/Windows + sdist, then publish to PyPI
  # ----------------------------------------------------------------------
  build-wheels:
    name: Build wheel (${{ matrix.os }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64 }
          - { os: ubuntu-latest,  target: aarch64 }
          - { os: macos-latest,   target: x86_64 }
          - { os: macos-latest,   target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      id-token: write # Trusted Publishing OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "{wheels-*,sdist}"
      - name: List artifacts
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ----------------------------------------------------------------------
  # Node: build napi binary per platform, publish to npm with provenance
  # ----------------------------------------------------------------------
  build-node:
    name: Build napi (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,    triple: linux-x64-gnu }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,   triple: linux-arm64-gnu, cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,         triple: darwin-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,        triple: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,      triple: win32-x64-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node

      # Linux aarch64: install the cross toolchain
      - name: Install aarch64-linux-gnu linker
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure cross linker
        if: matrix.cross
        run: |
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml

      - name: Install npm deps
        working-directory: bindings/node
        # `optionalDependencies` lists our own scoped sub-packages, used only at
        # end-user install time. CI doesn't need them and can't always resolve
        # them (a new version may not be on the registry yet during a release).
        run: npm ci --omit=optional

      - name: Build napi binary
        working-directory: bindings/node
        run: ./node_modules/.bin/napi build --platform --release --strip --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.triple }}
          path: bindings/node/codefold.*.node
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-node
    permissions:
      id-token: write # for npm provenance + Trusted Publishing OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Node 20 ships npm 10.x; Trusted Publishing requires npm >= 11.5.
      # Upgrade to latest so `npm publish --provenance` performs the OIDC
      # auth handshake (not just provenance signing).
      - name: Upgrade npm to latest
        run: npm install -g npm@latest && npm --version

      - name: Install npm deps
        working-directory: bindings/node
        # `optionalDependencies` lists our own scoped sub-packages, used only at
        # end-user install time. CI doesn't need them and can't always resolve
        # them (a new version may not be on the registry yet during a release).
        run: npm ci --omit=optional

      - name: Download napi artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
          pattern: napi-*
          merge-multiple: true

      - name: Copy binaries into npm/<triple>/ dirs
        working-directory: bindings/node
        run: ./node_modules/.bin/napi artifacts

      - name: Show what will publish
        working-directory: bindings/node
        run: |
          for d in npm/*/; do
            echo "== $d =="
            ls -la "$d"
          done

      - name: Build JS bindings (index.js + index.d.ts)
        working-directory: bindings/node
        # Build runs locally to produce the JS loader stubs. The .node binary it
        # would produce here is irrelevant — we replace with the prebuilt ones.
        run: ./node_modules/.bin/napi build --platform --release --strip --js index.js --dts index.d.ts

      - name: Wire up main package's optionalDependencies + copy binaries
        working-directory: bindings/node
        # --gh-release is omitted (defaults off). pre-publish copies each .node
        # into npm/<triple>/ and adds the entries to optionalDependencies in the
        # main package.json so npm picks the right sub-package per platform.
        run: ./node_modules/.bin/napi pre-publish -t npm --skip-optional-publish

      # npm Trusted Publishing: with `permissions: id-token: write` set on
      # this job, `npm publish --provenance` uses GitHub OIDC to authenticate
      # against npm. No NPM_TOKEN required. Configure the trusted publisher
      # for each package once at https://www.npmjs.com/package/<name>/access.

      - name: Publish per-platform sub-packages
        working-directory: bindings/node
        run: |
          for dir in npm/*/; do
            echo "== publishing $dir =="
            (cd "$dir" && npm publish --access public --provenance) || {
              code=$?
              if npm view "$(jq -r .name "$dir/package.json")@$(jq -r .version "$dir/package.json")" >/dev/null 2>&1; then
                echo "(already published, skipping)"
              else
                exit $code
              fi
            }
          done

      - name: Publish main @maxenceleguery/codefold package
        working-directory: bindings/node
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          npm publish --access public --provenance || {
            code=$?
            if npm view "${NAME}@${VERSION}" >/dev/null 2>&1; then
              echo "(${NAME}@${VERSION} already published, skipping)"
            else
              exit $code
            fi
          }
