[workspace]
resolver = "2"
members = [
    "crates/codefold-core",
    "crates/codefold-cli",
    "bindings/python",
    "bindings/node",
]

[workspace.package]
version = "0.8.3"
edition = "2021"
license = "MIT"
authors = ["maxenceleguery <maxence.leguery@gmail.com>"]
repository = "https://github.com/maxenceleguery/codefold"
homepage = "https://codefold.maxenceleguery.net"
documentation = "https://docs.rs/codefold-core"
rust-version = "1.77"
readme = "../../README.md"
keywords = ["llm", "ai", "code", "parser", "tree-sitter"]
categories = ["development-tools", "parser-implementations", "text-processing"]

[workspace.dependencies]
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"
pulldown-cmark = { version = "0.12", default-features = false }
thiserror = "1"
tiktoken-rs = "0.6"
once_cell = "1"
insta = { version = "1", features = ["yaml"] }
criterion = { version = "0.5", features = ["html_reports"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
