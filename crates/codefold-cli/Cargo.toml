[package]
name = "codefold-cli"
description = "CLI for codefold — structural code reader for LLM agents."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["llm", "ai", "code", "cli", "tree-sitter"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[[bin]]
name = "codefold"
path = "src/main.rs"

[dependencies]
# `version` here is what cargo publishes against. The `path` is used locally;
# crates.io strips it and uses the version. Keep these in sync with workspace.package.version.
codefold-core = { path = "../codefold-core", version = "0.6.0" }
clap = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
